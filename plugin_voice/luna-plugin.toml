name = "plugin-voice"
shown_name = "Voice"
version = "0.8.1"
description = "Full-duplex voice conversations that know who is speaking — Gemini Live speech-to-speech in this agent's own persona, noise-robust turn taking, owner voice imprint, in-call knowledge tools, Luna stays the hands for real work."
entry = "plugin_voice"
sdk_version = "0"
license = "MIT"
tags = ["voice", "talk", "realtime", "gemini", "interface"]
readme = """
# plugin-voice

Talk with your agent by voice — full duplex, interruptible, and it knows who's
talking. plugin-voice adds a sidebar voice widget (live waveforms for you and
the agent) powered by Gemini Live speech-to-speech, working in three lanes:

- **Talking**: the realtime model speaks AS your agent — its real name,
  greeting, attitude, and filler style, replicated from the agent's own
  personality at connect time.
- **Knowledge**: read-only info tools (memory, wiki, files, ...) are exposed
  directly to the talker, so quick questions get answered mid-sentence.
- **Doing**: real work is delegated to your actual agent in the background —
  the talker narrates, keeps the conversation going, and relays a short spoken
  summary when the task finishes. Details land in your chat.

Beyond plugin-talk, this plugin adds an **owner voice imprint**: record a few
phrases in Settings; the plugin builds a voice profile and flags whether the
current speaker is you — unrecognized voices get read-only politeness.

Built to hold up in rooms that aren't silent: server-side voice activity
detection tuned so beeps and background chatter don't open turns, and the
model itself declines to answer audio that clearly isn't addressed to it.
Interrupt it naturally — it stops, listens, and picks up where it left off.

Requires plugin-vault and a Google AI (Gemini) API key (pasted or env). Audio
flows browser ⇄ Google over a WebSocket armed with a short-lived session
token — your API key never reaches the browser; the imprint check runs on
lightweight spectral features on your Luna, never leaving it.

The Luna View head model (`head.bin`) is a point-cloud sample of the
"Face Cap" demo head by [Face Cap](https://www.bannaflak.com/face-cap),
as distributed with the three.js examples.

Source: https://github.com/huemorgan/plugin-voice
"""

[requires]
tools = 2
depends_on = ["plugin-vault"]

[[tools]]
name = "voice_status"
description = "Status of the voice setup: Gemini key availability (own/env), live voice and model, imprint ready."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "voice_connect"
description = "Complete the voice setup with whatever Gemini key is available; validates it against the Gemini API and sets up the personality-matched talker."
policy = "ask"
risk_level = "medium"
